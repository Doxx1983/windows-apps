name: Zwischenablage bauen

on:
  push:
    paths:
      - 'zwischenablage/**'
      - '.github/workflows/zwischenablage.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Veröffentlichen
        working-directory: zwischenablage
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ../out
      - uses: actions/upload-artifact@v4
        with:
          name: Zwischenablage
          path: out/Zwischenablage.exe
